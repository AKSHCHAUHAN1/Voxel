services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voxel
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: voxel
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voxel -d voxel']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs-volume-init:
    image: alpine:3.22
    command: ['sh', '-c', 'chown -R 10001:10001 /data']
    volumes:
      - rustfs_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${VOXEL_STORAGE_ACCESS_KEY:-voxel}
      RUSTFS_SECRET_KEY: ${VOXEL_STORAGE_SECRET_KEY:-voxel-development-only}
    depends_on:
      rustfs-volume-init:
        condition: service_completed_successfully
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: amazon/aws-cli:2.37.5
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    environment:
      AWS_ACCESS_KEY_ID: ${VOXEL_STORAGE_ACCESS_KEY:-voxel}
      AWS_SECRET_ACCESS_KEY: ${VOXEL_STORAGE_SECRET_KEY:-voxel-development-only}
      AWS_DEFAULT_REGION: ${VOXEL_STORAGE_REGION:-us-east-1}
      VOXEL_STORAGE_BUCKET: ${VOXEL_STORAGE_BUCKET:-voxel-assets}
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${VOXEL_STORAGE_BUCKET}" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${VOXEL_STORAGE_BUCKET}"
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
