name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://voxel:voxel@localhost:5432/voxel?schema=public
      VOXEL_E2E_DATABASE_URL: postgresql://voxel:voxel@localhost:5432/voxel?schema=public
      VOXEL_E2E_REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voxel
          POSTGRES_USER: voxel
          POSTGRES_PASSWORD: voxel
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U voxel -d voxel"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: |
          npm install --global npm@11.8.0
          npm ci

      - name: Audit locked dependencies
        run: npm audit

      - name: Generate Prisma Client
        run: npm run prisma:generate -w @voxel/api

      - name: Apply database migrations
        run: npm run prisma:deploy -w @voxel/api

      - name: Lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Validate Prisma schema
        run: npm exec --workspace @voxel/api -- prisma validate --schema prisma/schema.prisma

      - name: Build production workspaces
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser traces
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Build API runtime container
        run: docker build --file Dockerfile.api --target runtime --tag voxel-api:${{ github.sha }} .

      - name: Build API migration container
        run: docker build --file Dockerfile.api --target migrate --tag voxel-api-migrate:${{ github.sha }} .

      - name: Build web runtime container
        run: docker build --file Dockerfile.web --tag voxel-web:${{ github.sha }} .
